name: Release desktop

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: "--bundles deb,rpm,appimage"
          - platform: macos-latest
            args: "--target universal-apple-darwin --bundles app,dmg"
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: pnpm test

      - name: Build and draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: pnpm tauri
          tagName: ${{ github.ref_name }}
          releaseName: "Inkwell __VERSION__"
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: false
          args: ${{ matrix.args }}
          releaseBody: |
            Inkwell __VERSION__ for Linux and macOS.

            **Linux**
            - `.AppImage` for any distribution
            - `.deb` for Debian/Ubuntu
            - `.rpm` for Fedora/RHEL

            Arch Linux packaging is in `packaging/arch`; AUR publication is
            on hold while AUR registration is closed.

            **macOS (unsigned)**
            The macOS build is not code-signed yet. On first launch, right-click
            **Inkwell.app** and choose **Open**, or run:

            ```
            xattr -dr com.apple.quarantine /Applications/Inkwell.app
            ```

            Browser drafts are not shared with the desktop app; export them from
            the web build at <https://sarosaka-orz.github.io/inkwell/> first.
