<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>inkwell</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@200;300;400&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f4efe6;
    --paper-deep: #ece6da;
    --surface: #f0ebe2;
    --ink: #2a2118;
    --ink-mid: rgba(42,33,24,0.4);
    --ink-light: rgba(42,33,24,0.18);
    --ink-faint: rgba(42,33,24,0.07);
    --ink-ghost: rgba(42,33,24,0.035);
    --accent: #a08060;
    --accent-dim: rgba(160,128,96,0.08);
    --moss: #7a8a6e;
    --rust: #a07050;
    --sidebar-w: 220px;
    --header-h: 44px;
    --tt: 0.4s ease;
  }
  [data-theme="dark"] {
    --paper: #1c1914;
    --paper-deep: #17140f;
    --surface: #242019;
    --ink: #d8cfc0;
    --ink-mid: rgba(216,207,192,0.4);
    --ink-light: rgba(216,207,192,0.18);
    --ink-faint: rgba(216,207,192,0.07);
    --ink-ghost: rgba(216,207,192,0.04);
    --accent: #c8a070;
    --accent-dim: rgba(200,160,112,0.08);
    --moss: #8a9a7e;
    --rust: #c08060;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--paper);font-family:'EB Garamond',serif;color:var(--ink);transition:background var(--tt),color var(--tt)}
  body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background-image:url("data:image/svg+xml,%3Csvg width='300' height='300' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E")}
  [data-theme="dark"] body::before{opacity:0.6}

  /* ── Header ── */
  header{position:fixed;top:0;left:0;right:0;height:var(--header-h);display:flex;align-items:center;justify-content:space-between;padding:0 1.4rem;z-index:10;background:linear-gradient(to bottom,var(--paper) 50%,transparent);transition:background var(--tt),opacity 0.5s}
  .logo{display:flex;align-items:baseline;gap:0.4rem}
  .logo .mark{font-family:'Noto Serif JP',serif;font-weight:200;font-size:1.1rem;opacity:0.5}
  .logo .name{font-size:0.56rem;color:var(--ink-mid);letter-spacing:0.25em;font-style:italic}
  .hdr{display:flex;align-items:center;gap:0.1rem}
  .btn{background:none;border:none;font-family:'EB Garamond',serif;font-size:0.6rem;color:var(--ink-mid);letter-spacing:0.07em;cursor:pointer;padding:0.18rem 0.4rem;border-radius:3px;transition:color 0.2s,background 0.2s;white-space:nowrap}
  .btn:hover{color:var(--ink);background:var(--ink-faint)}
  .btn.active{color:var(--accent);background:var(--accent-dim)}
  .btn-i{width:24px;height:24px;display:flex;align-items:center;justify-content:center;padding:0;font-size:0.65rem;opacity:0.3;transition:opacity 0.2s}
  .btn-i:hover{opacity:0.75}
  .sep{width:1px;height:12px;background:var(--ink-ghost);margin:0 0.3rem;flex-shrink:0}

  /* ── Sidebar ── */
  aside{position:fixed;top:var(--header-h);left:0;width:var(--sidebar-w);height:calc(100% - var(--header-h));display:flex;flex-direction:column;z-index:5;border-right:1px solid var(--ink-ghost);background:var(--paper);transition:transform 0.45s cubic-bezier(0.4,0,0.2,1),opacity 0.35s,background var(--tt)}
  aside.collapsed{transform:translateX(-100%);opacity:0;pointer-events:none}
  .sb-head{display:flex;align-items:center;justify-content:space-between;padding:1.6rem 1rem 0.6rem;flex-shrink:0}
  .sb-label{font-size:0.45rem;color:var(--ink-light);letter-spacing:0.3em;text-transform:uppercase}
  .btn-new{background:none;border:none;font-size:0.7rem;color:var(--ink-light);cursor:pointer;width:18px;height:18px;display:flex;align-items:center;justify-content:center;border-radius:3px;transition:color 0.2s,background 0.2s;line-height:1}
  .btn-new:hover{color:var(--ink);background:var(--ink-faint)}
  .file-list{list-style:none;flex:1;overflow-y:auto;padding:0 0.4rem}
  .file-list::-webkit-scrollbar{width:2px}
  .file-list::-webkit-scrollbar-track{background:transparent}
  .file-list::-webkit-scrollbar-thumb{background:var(--ink-ghost);border-radius:1px}
  .fi{display:flex;align-items:center;gap:0.3rem;padding:0.3rem 0.35rem;font-size:0.64rem;color:var(--ink-mid);cursor:pointer;border-radius:3px;transition:background 0.15s,color 0.15s}
  .fi:hover{background:var(--ink-faint);color:var(--ink)}
  .fi.active{color:var(--accent);background:var(--accent-dim)}
  .fi .fn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .fi .fw{font-family:'JetBrains Mono',monospace;font-weight:300;font-size:0.42rem;color:var(--ink-light);flex-shrink:0;opacity:0;transition:opacity 0.15s}
  .fi:hover .fw,.fi.active .fw{opacity:1}
  .fi .fd{background:none;border:none;font-size:0.55rem;color:var(--ink-light);cursor:pointer;opacity:0;transition:opacity 0.15s,color 0.15s;padding:0 0.1rem;line-height:1;flex-shrink:0}
  .fi:hover .fd{opacity:1}
  .fd:hover{color:var(--rust)}
  .fi .ri{flex:1;min-width:0;background:none;border:none;outline:none;font-family:'EB Garamond',serif;font-size:0.64rem;color:var(--ink);padding:0;border-bottom:1px solid var(--accent)}
  .sb-foot{padding:0.5rem 1rem;font-size:0.42rem;color:var(--ink-light);letter-spacing:0.05em;font-family:'JetBrains Mono',monospace;font-weight:300;border-top:1px solid var(--ink-ghost);flex-shrink:0;transition:border-color var(--tt);display:flex;justify-content:space-between;align-items:center}

  /* ── Outline Panel (inside sidebar) ── */
  .outline-panel{display:none;flex:1;overflow-y:auto;padding:0 0.6rem}
  .outline-panel.visible{display:block}
  .outline-panel::-webkit-scrollbar{width:2px}
  .outline-panel::-webkit-scrollbar-thumb{background:var(--ink-ghost);border-radius:1px}
  .outline-item{display:block;font-size:0.62rem;color:var(--ink-mid);cursor:pointer;padding:0.25rem 0.3rem;border-radius:2px;transition:color 0.15s,background 0.15s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-decoration:none}
  .outline-item:hover{color:var(--ink);background:var(--ink-faint)}
  .outline-item.active{color:var(--accent)}
  .outline-item.h2{padding-left:0.8rem}
  .outline-item.h3{padding-left:1.3rem;font-size:0.58rem}
  .outline-item.h4{padding-left:1.8rem;font-size:0.55rem}

  /* ── Main ── */
  main{position:fixed;top:var(--header-h);left:var(--sidebar-w);right:0;height:calc(100% - var(--header-h));transition:left 0.45s cubic-bezier(0.4,0,0.2,1);display:flex;justify-content:center;z-index:3}
  main.expanded{left:0}
  .ew{width:100%;max-width:640px;height:100%;padding:2rem 1.8rem 3.5rem;display:flex;flex-direction:column;position:relative}
  .ew::before{content:'';position:absolute;top:1.6rem;bottom:3rem;left:0;width:1px;background:linear-gradient(to bottom,transparent,var(--ink-faint) 15%,var(--ink-faint) 85%,transparent);opacity:0.3}
  .dt{font-family:'EB Garamond',serif;font-weight:400;font-size:clamp(1.15rem,1.8vw,1.4rem);color:var(--ink);border:none;background:none;outline:none;width:100%;padding:0 0 0.45rem 0;margin-bottom:0.5rem;border-bottom:1px solid var(--ink-ghost);letter-spacing:0.015em;line-height:1.3;transition:border-color 0.3s,color var(--tt)}
  .dt:focus{border-bottom-color:var(--ink-faint)}
  .dt::placeholder{color:var(--ink-light)}
  .ec{flex:1;position:relative;overflow:hidden}
  .ed{width:100%;height:100%;border:none;background:none;outline:none;resize:none;font-family:'JetBrains Mono',monospace;font-weight:300;font-size:0.78rem;line-height:1.9;color:var(--ink);letter-spacing:0.01em;caret-color:transparent;overflow-y:auto;padding:0;transition:color var(--tt)}
  .ed::placeholder{color:var(--ink-light);font-style:italic}
  .ed::selection{background:var(--accent-dim)}
  .ed::-webkit-scrollbar{width:3px}
  .ed::-webkit-scrollbar-track{background:transparent}
  .ed::-webkit-scrollbar-thumb{background:var(--ink-ghost);border-radius:2px}

  /* ── Smooth Caret ── */
  .sc{position:absolute;width:1px;background:var(--accent);pointer-events:none;opacity:0;transition:left 0.08s cubic-bezier(0.2,0,0.3,1),top 0.08s cubic-bezier(0.2,0,0.3,1),height 0.06s ease,background var(--tt),box-shadow var(--tt);z-index:5}
  [data-theme="dark"] .sc{box-shadow:0 0 4px rgba(200,160,112,0.15)}
  .sc.v{opacity:1;animation:cb 1.1s step-end 0.45s infinite}
  @keyframes cb{0%,100%{opacity:1}50%{opacity:0}}

  /* ── Preview ── */
  .pv{display:none;width:100%;height:100%;overflow-y:auto;scroll-behavior:smooth}
  .pv::-webkit-scrollbar{width:3px}
  .pv::-webkit-scrollbar-track{background:transparent}
  .pv::-webkit-scrollbar-thumb{background:var(--ink-ghost);border-radius:2px}
  .pv.v{display:block}
  .pc{font-family:'EB Garamond',serif;font-size:1.02rem;line-height:1.85;color:var(--ink);word-wrap:break-word;transition:color var(--tt)}
  .pc h1{font-family:'Noto Serif JP',serif;font-weight:300;font-size:1.65rem;margin:2.2rem 0 0.9rem;padding-bottom:0.35rem;border-bottom:1px solid var(--ink-ghost);letter-spacing:0.02em}
  .pc h1:first-child{margin-top:0}
  .pc h2{font-weight:500;font-size:1.25rem;margin:1.8rem 0 0.6rem}
  .pc h3{font-weight:500;font-size:1.05rem;margin:1.3rem 0 0.4rem;color:var(--accent)}
  .pc h4,.pc h5,.pc h6{font-weight:500;font-size:0.95rem;margin:1rem 0 0.3rem}
  .pc p{margin:0 0 0.9rem}
  .pc a{color:var(--accent);text-decoration:none;border-bottom:1px solid var(--accent-dim);transition:border-color 0.2s}
  .pc a:hover{border-bottom-color:var(--accent)}
  .pc blockquote{margin:1rem 0;padding:0.35rem 1rem;border-left:2px solid var(--accent);color:var(--ink-mid);font-style:italic}
  .pc blockquote p:last-child{margin-bottom:0}
  .pc ul,.pc ol{margin:0 0 0.9rem;padding-left:1.4rem}
  .pc li{margin-bottom:0.2rem}
  .pc li.task-list-item{list-style:none;margin-left:-1.4rem}
  .pc li.task-list-item input[type="checkbox"]{margin-right:0.35rem;accent-color:var(--accent);transform:scale(0.85);vertical-align:middle}
  .pc img{max-width:100%;border-radius:3px;margin:0.4rem 0}
  .pc hr{border:none;height:1px;background:var(--ink-faint);margin:1.8rem 0}
  .pc table{width:100%;border-collapse:collapse;margin:0.9rem 0;font-size:0.88rem}
  .pc th,.pc td{padding:0.4rem 0.6rem;border:1px solid var(--ink-ghost);text-align:left}
  .pc th{background:var(--ink-ghost);font-weight:500}
  .pc code{font-family:'JetBrains Mono',monospace;font-weight:300;font-size:0.76em;background:var(--ink-ghost);padding:0.1em 0.3rem;border-radius:3px;color:var(--accent)}
  .pc pre{margin:1rem 0;padding:0.9rem 1rem;background:var(--ink-ghost);border-radius:4px;overflow-x:auto;border-left:2px solid color-mix(in srgb,var(--accent) 30%,transparent)}
  .pc pre code{background:none;padding:0;color:var(--ink);font-size:0.73rem;line-height:1.7}
  .pc kbd{font-family:'JetBrains Mono',monospace;font-size:0.68em;padding:0.08em 0.35em;border:1px solid var(--ink-light);border-radius:3px;background:var(--ink-ghost);box-shadow:0 1px 0 var(--ink-light)}
  .pc .mc{margin:1.3rem 0;text-align:center;padding:0.8rem;background:var(--ink-ghost);border-radius:4px;overflow-x:auto}
  .pc .mc svg{max-width:100%}
  .pc .me{color:var(--rust);font-style:italic;font-size:0.82rem;padding:0.4rem}
  .pc .mb{margin:1.3rem 0;text-align:center;padding:0.6rem 0;overflow-x:auto}
  .pc .mb .katex-display{margin:0}
  .pc .katex{font-size:1.02em}
  .pc .mb .katex{font-size:1.12em}

  /* ── Search Bar ── */
  .search-bar{position:fixed;top:var(--header-h);right:0;z-index:15;background:var(--paper);border-bottom:1px solid var(--ink-ghost);padding:0.5rem 1rem;display:none;align-items:center;gap:0.5rem;box-shadow:0 2px 8px rgba(0,0,0,0.04);transition:background var(--tt)}
  .search-bar.v{display:flex}
  .search-bar input{font-family:'JetBrains Mono',monospace;font-weight:300;font-size:0.7rem;color:var(--ink);background:var(--ink-ghost);border:1px solid var(--ink-ghost);border-radius:3px;padding:0.3rem 0.5rem;outline:none;width:180px;transition:border-color 0.2s,color var(--tt),background var(--tt)}
  .search-bar input:focus{border-color:var(--accent)}
  .search-bar input::placeholder{color:var(--ink-light)}
  .sr{font-family:'JetBrains Mono',monospace;font-weight:300;font-size:0.5rem;color:var(--ink-light);min-width:40px;letter-spacing:0.05em}
  .sbtn{background:none;border:none;font-size:0.6rem;color:var(--ink-mid);cursor:pointer;padding:0.2rem 0.35rem;border-radius:2px;transition:color 0.2s,background 0.2s}
  .sbtn:hover{color:var(--ink);background:var(--ink-faint)}

  /* ── Focus / Typewriter ── */
  body.focus-mode .ed .ln{opacity:0.25;transition:opacity 0.3s}
  body.focus-mode .ed .ln.active{opacity:1}
  body.typewriter-mode .ed .ln{transition:opacity 0.3s}
  .mode-indicator{position:fixed;bottom:1.8rem;right:1.4rem;font-size:0.42rem;color:var(--ink-light);letter-spacing:0.15em;font-family:'JetBrains Mono',monospace;font-weight:300;opacity:0;transition:opacity 0.3s;z-index:15;pointer-events:none}
  .mode-indicator.v{opacity:0.5}

  /* ── Status Bar ── */
  footer{position:fixed;bottom:0;left:var(--sidebar-w);right:0;height:20px;display:flex;align-items:center;justify-content:space-between;padding:0 1.4rem;z-index:10;background:linear-gradient(to top,var(--paper) 40%,transparent);transition:left 0.45s cubic-bezier(0.4,0,0.2,1),background var(--tt);font-size:0.44rem;color:var(--ink-light);letter-spacing:0.05em;font-family:'JetBrains Mono',monospace;font-weight:300}
  footer.expanded{left:0}
  .sl,.sr-bar{display:flex;gap:0.7rem;align-items:center}
  .sd{display:inline-block;width:3px;height:3px;border-radius:50%;background:var(--moss);opacity:0.35;transition:background 0.3s,opacity 0.3s}
  .sd.saving{background:var(--rust);opacity:1;animation:dp 0.5s ease}
  @keyframes dp{0%,100%{transform:scale(1)}50%{transform:scale(1.6)}}

  /* ── Zen ── */
  body.zen header,body.zen aside,body.zen footer,body.zen .search-bar{opacity:0;pointer-events:none}
  body.zen main{left:0}
  .ze{position:fixed;top:0.35rem;right:0.35rem;z-index:20;opacity:0;transition:opacity 0.3s;pointer-events:none}
  body.zen .ze{opacity:0.15;pointer-events:auto}
  body.zen .ze:hover{opacity:0.55}

  /* ── Syntax Highlighting ── */
  .hljs-keyword{color:#7a4a8a}.hljs-string,.hljs-addition{color:#5a7a3a}.hljs-comment,.hljs-doctag{color:#9a8a7a;font-style:italic}.hljs-number,.hljs-literal{color:#9a5a30}.hljs-title,.hljs-section{color:#6a5a8a}.hljs-type,.hljs-built_in{color:#3a6a7a}.hljs-attr{color:#8a6a3a}.hljs-deletion{color:#a05050}.hljs-meta{color:#8a7a6a}
  [data-theme="dark"] .hljs-keyword{color:#c0a0d0}[data-theme="dark"] .hljs-string,[data-theme="dark"] .hljs-addition{color:#a0c880}[data-theme="dark"] .hljs-comment,[data-theme="dark"] .hljs-doctag{color:#8a7a6a}[data-theme="dark"] .hljs-number,[data-theme="dark"] .hljs-literal{color:#d0a070}[data-theme="dark"] .hljs-title,[data-theme="dark"] .hljs-section{color:#b0a0d0}[data-theme="dark"] .hljs-type,[data-theme="dark"] .hljs-built_in{color:#80c0d0}[data-theme="dark"] .hljs-attr{color:#d0b070}[data-theme="dark"] .hljs-deletion{color:#d08080}[data-theme="dark"] .hljs-meta{color:#a09080}

  @media print{header,aside,footer,.ze,.sc,.ec,.search-bar{display:none!important}main{left:0!important}.ew{max-width:100%;padding:1cm}.pv{display:block!important}.pc{font-size:11pt;line-height:1.6}pre{white-space:pre-wrap;word-wrap:break-word}.pc h1,.pc h2,.pc h3{page-break-after:avoid}pre,.mb,.mc{page-break-inside:avoid}}
  @media(max-width:768px){aside{transform:translateX(-100%);opacity:0;pointer-events:none}main,footer{left:0}.ew{padding:1rem 0.9rem 3rem}}
</style>
</head>
<body>

<header>
  <div class="logo"><span class="mark">墨</span><span class="name">inkwell</span></div>
  <div class="hdr">
    <button class="btn" id="bSidebar" title="Toggle sidebar">files</button>
    <div class="sep"></div>
    <button class="btn" id="bPreview" title="Preview (Ctrl+P)">preview</button>
    <div class="sep"></div>
    <button class="btn" id="bEHtml" title="Export HTML">html</button>
    <button class="btn" id="bEPdf" title="Export PDF">pdf</button>
    <div class="sep"></div>
    <button class="btn" id="bSearch" title="Search (Ctrl+F)">search</button>
    <button class="btn" id="bOutline" title="Outline (Alt+O)">outline</button>
    <div class="sep"></div>
    <button class="btn" id="bZen" title="Zen mode (Alt+Z)">zen</button>
    <button class="btn btn-i" id="bTheme" title="Toggle theme">&cir;</button>
  </div>
</header>

<aside id="sidebar">
  <div class="sb-head">
    <span class="sb-label">pages</span>
    <button class="btn-new" id="bNew" title="New page">+</button>
  </div>
  <ul class="file-list" id="fList"></ul>
  <div class="outline-panel" id="outlinePanel"></div>
  <div class="sb-foot" id="sbFoot"><span id="sbStats"></span><span id="sbMode"></span></div>
</aside>

<main id="main">
  <div class="ew">
    <input class="dt" id="title" type="text" placeholder="untitled" spellcheck="false"/>
    <div class="ec">
      <textarea class="ed" id="editor" placeholder="begin writing..." spellcheck="true"></textarea>
      <div class="sc" id="caret"></div>
    </div>
    <div class="pv" id="pv"><div class="pc" id="pc"></div></div>
  </div>
</main>

<div class="search-bar" id="searchBar">
  <input type="text" id="searchInput" placeholder="find..."/>
  <span class="sr" id="searchCount"></span>
  <button class="sbtn" id="sPrev" title="Previous">&#8593;</button>
  <button class="sbtn" id="sNext" title="Next">&#8595;</button>
  <input type="text" id="replaceInput" placeholder="replace..."/>
  <button class="sbtn" id="sReplace" title="Replace">rep</button>
  <button class="sbtn" id="sReplaceAll" title="Replace all">all</button>
  <button class="sbtn" id="sClose" title="Close">&times;</button>
</div>

<div class="mode-indicator" id="modeInd"></div>

<footer id="footer">
  <div class="sl"><span class="sd" id="saveDot"></span><span id="statusSaved">saved</span></div>
  <div class="sr-bar"><span id="statusPos">1:1</span><span id="statusTime"></span></div>
</footer>

<button class="btn btn-i ze" id="bEscZen" title="Exit zen (Esc)">&times;</button>

<script>
(()=>{
const $=id=>document.getElementById(id);
const editor=$('editor'),title=$('title'),sidebar=$('sidebar'),mainEl=$('main'),footerEl=$('footer'),fList=$('fList'),sbFoot=$('sbFoot'),sbStats=$('sbStats'),sbMode=$('sbMode'),saveDot=$('saveDot'),statusSaved=$('statusSaved'),statusPos=$('statusPos'),statusTime=$('statusTime'),caretEl=$('caret'),pv=$('pv'),pc=$('pc'),bPreview=$('bPreview'),searchBar=$('searchBar'),searchInput=$('searchInput'),searchCount=$('searchCount'),replaceInput=$('replaceInput'),outlinePanel=$('outlinePanel'),modeInd=$('modeInd');

const SK='inkwell_docs',TK='inkwell_theme';
let docs={},activeId=null,saveTimer=null,mirror=null,renaming=null,previewActive=false,previewLoaded=false,previewRaf=null;
let searchMatches=[],searchIdx=-1,searchOpen=false;
let focusMode=false,typewriterMode=false,outlineOpen=false;

// ── Storage ──
function loadDocs(){try{docs=JSON.parse(localStorage.getItem(SK))||{}}catch{docs={}}if(!Object.keys(docs).length){const id=mkId();docs[id]={title:'',body:'',created:Date.now(),updated:Date.now()}}}
function saveDocs(){try{localStorage.setItem(SK,JSON.stringify(docs))}catch{}}
function mkId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}

// ── File Management ──
function renderFiles(){
  const sorted=Object.entries(docs).sort((a,b)=>b[1].updated-a[1].updated);
  fList.textContent='';
  for(const[id,doc]of sorted){
    const li=document.createElement('li');li.className='fi'+(id===activeId?' active':'');li.dataset.id=id;
    const ns=document.createElement('span');ns.className='fn';ns.textContent=doc.title||'untitled';
    const ws=document.createElement('span');ws.className='fw';ws.textContent=(doc.body.trim()?doc.body.trim().split(/\s+/).length:0)+'w';
    const db=document.createElement('button');db.className='fd';db.textContent='×';db.title='Delete';
    li.appendChild(ns);li.appendChild(ws);li.appendChild(db);

function createMirror(){

}

  s.fontFamily=cs.fontFamily;s.fontSize=cs.fontSize;s.fontWeight=cs.fontWeight;s.fontStyle=cs.fontStyle;s.letterSpacing=cs.letterSpacing;s.lineHeight=cs.lineHeight;s.padding=cs.padding;s.border=cs.border;s.boxSizing=cs.boxSizing;s.textIndent=cs.textIndent;s.tabSize=cs.tabSize||'8';s.MozTabSize=cs.MozTabSize||'8';

function updCaret(){

  mirror.textContent='';const marker=document.createElement('span');marker.textContent='​';
  const lines=editor.value.substring(0,pos).split('\n');
  for(let i=0;i<lines.length;i++){if(i>0)mirror.appendChild(document.createElement('br'));mirror.appendChild(document.createTextNode(lines[i]));if(i===lines.length-1)mirror.appendChild(marker)}

}

// ── Outline ──
function parseHeadings(md){
  const headings=[],lines=md.split('\n');let inCode=false;
  for(let i=0;i<lines.length;i++){
    const l=lines[i];
    if(l.match(/^```/)){inCode=!inCode;continue}
    if(inCode)continue;
    const m=l.match(/^(#{1,6})\s+(.+)/);
    if(m)headings.push({level:m[1].length,text:m[2].trim(),line:i});
  }
  return headings;
}
function renderOutline(){
  const doc=docs[activeId];if(!doc)return;
  const headings=parseHeadings(doc.body);
  outlinePanel.textContent='';
  if(!headings.length){const p=document.createElement('div');p.style.cssText='font-size:0.55rem;color:var(--ink-light);padding:0.5rem 0.3rem;font-style:italic';p.textContent='no headings';outlinePanel.appendChild(p);return}
  for(const h of headings){
    const a=document.createElement('a');a.className='outline-item h'+h.level;a.textContent=h.text;a.href='#';
    a.addEventListener('click',e=>{e.preventDefault();scrollToLine(h.line)});
    outlinePanel.appendChild(a);
  }
}
function scrollToLine(lineIdx){
  if(previewActive){
    const headings=pc.querySelectorAll('h1,h2,h3,h4,h5,h6');
    let hIdx=0;const docHeadings=parseHeadings(docs[activeId]?.body||'');
    for(let i=0;i<docHeadings.length;i++){if(docHeadings[i].line===lineIdx){hIdx=i;break}}
    if(headings[hIdx])headings[hIdx].scrollIntoView({behavior:'smooth',block:'start'});
  }else{
    const lines=editor.value.split('\n');let charIdx=0;
    for(let i=0;i<lineIdx&&i<lines.length;i++)charIdx+=lines[i].length+1;
    editor.focus();editor.setSelectionRange(charIdx,charIdx);
    const lineHeight=parseFloat(getComputedStyle(editor).lineHeight)||20;
    editor.scrollTop=lineIdx*lineHeight-editor.clientHeight/2;
  }
}
function toggleOutline(){
  outlineOpen=!outlineOpen;

// ── Search & Replace ──
function toggleSearch(){
  searchOpen=!searchOpen;
  searchBar.classList.toggle('v',searchOpen);
  if(searchOpen){searchInput.focus();searchInput.select()}
  else{clearSearch();editor.focus()}
}
function clearSearch(){searchMatches=[];searchIdx=-1;searchCount.textContent='';editor.focus()}
function doSearch(){
  const q=searchInput.value;if(!q){clearSearch();return}
  const text=editor.value,lq=q.toLowerCase();searchMatches=[];searchIdx=-1;
  let start=0;while(true){const idx=text.toLowerCase().indexOf(lq,start);if(idx===-1)break;searchMatches.push(idx);start+=idx+1}
  searchCount.textContent=searchMatches.length?searchMatches.length+' found':'none';
  if(searchMatches.length){searchIdx=0;highlightMatch()}
}
function highlightMatch(){if(searchIdx<0||!searchMatches.length)return;const pos=searchMatches[searchIdx];editor.focus();editor.setSelectionRange(pos,pos+searchInput.value.length);searchCount.textContent=(searchIdx+1)+'/'+searchMatches.length}
function searchNext(){if(!searchMatches.length)return;searchIdx=(searchIdx+1)%searchMatches.length;highlightMatch()}
function searchPrev(){if(!searchMatches.length)return;searchIdx=(searchIdx-1+searchMatches.length)%searchMatches.length;highlightMatch()}
function doReplace(){
  if(searchIdx<0||!searchMatches.length)return;
  const q=searchInput.value,r=replaceInput.value,pos=searchMatches[searchIdx];
  editor.value=editor.value.substring(0,pos)+r+editor.value.substring(pos+q.length);
  editor.setSelectionRange(pos,pos+r.length);scheduleSave();doSearch();
}
function doReplaceAll(){
  const q=searchInput.value,r=replaceInput.value;if(!q)return;
  const re=new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi');
  editor.value=editor.value.replace(re,r);scheduleSave();doSearch();
}

// ── Keyboard Shortcuts ──
function wrapSelection(before,after){
  const start=editor.selectionStart,end=editor.selectionEnd,text=editor.value;
  const sel=text.substring(start,end);
  editor.value=text.substring(0,start)+before+sel+after+text.substring(end);
  if(sel.length>0)editor.setSelectionRange(start+before.length,start+before.length+sel.length);
  else{const p=start+before.length;editor.setSelectionRange(p,p)}
  editor.focus();scheduleSave();requestAnimationFrame(updCaret);if(previewActive)queuePreview();
}
function insertPrefix(prefix){
  const start=editor.selectionStart,text=editor.value;
  const lineStart=text.lastIndexOf('\n',start-1)+1;
  editor.value=text.substring(0,lineStart)+prefix+text.substring(lineStart);
  editor.setSelectionRange(start+prefix.length,start+prefix.length);
  editor.focus();scheduleSave();requestAnimationFrame(updCaret);if(previewActive)queuePreview();
}
function handleShortcuts(e){
  const mod=e.ctrlKey||e.metaKey;
  if(mod&&e.key==='b'){e.preventDefault();wrapSelection('**','**')}
  if(mod&&e.key==='i'){e.preventDefault();wrapSelection('*','*')}
  if(mod&&e.key==='`'){e.preventDefault();wrapSelection('`','`')}
  if(mod&&e.key==='k'){e.preventDefault();wrapSelection('[','](url)')}
  if(mod&&e.key==='p'){e.preventDefault();togglePreview()}
  if(mod&&e.key==='f'){e.preventDefault();toggleSearch()}
  if(mod&&e.key==='h'&&searchOpen){e.preventDefault();doReplace()}
  if(mod&&e.key==='s'){e.preventDefault();saveCurrent();statusSaved.textContent='saved';saveDot.classList.remove('saving')}
  if(e.altKey&&e.key==='z'){e.preventDefault();toggleZen()}
  if(e.altKey&&e.key==='o'){e.preventDefault();toggleOutline()}
  if(e.altKey&&e.key==='f'){e.preventDefault();toggleFocus()}
  if(e.altKey&&e.key==='t'){e.preventDefault();toggleTypewriter()}
  if(e.key==='Escape'){
    if(document.body.classList.contains('zen'))toggleZen();
    if(searchOpen)toggleSearch();
  }
  if(e.key==='Tab'&&document.activeElement===editor){
    e.preventDefault();const s=editor.selectionStart,en=editor.selectionEnd;
    editor.value=editor.value.substring(0,s)+'  '+editor.value.substring(en);
    editor.selectionStart=editor.selectionEnd=s+2;scheduleSave();requestAnimationFrame(updCaret);if(previewActive)queuePreview();
  }
  if(e.key==='Enter'&&document.activeElement===searchInput){e.preventDefault();searchNext()}
  if(e.key==='Enter'&&e.shiftKey&&document.activeElement===searchInput){e.preventDefault();searchPrev()}
}

// ── Auto-pairing ──
function handleAutoPair(e){
  if(document.activeElement!==editor)return;
  const pairs={'"':'"','\'':'\'','`':'`','{':'}','[':']','(':')'};
  const ch=e.key;
  if(pairs[ch]){
    const start=editor.selectionStart,end=editor.selectionEnd,text=editor.value;
    const sel=text.substring(start,end);
    e.preventDefault();

    const p=start+1+sel.length;editor.setSelectionRange(sel.length?start:start+1,p);
    scheduleSave();requestAnimationFrame(updCaret);if(previewActive)queuePreview();
  }
}

function insertImage(file){
  if(!file.type.startsWith('image/'))return;
  if(file.size>10*1024*1024){alert('Image too large (max 10MB)');return}
  const reader=new FileReader();
  reader.onload=()=>{

// ── Markdown Preview ──
function loadLibs(){
  return new Promise(resolve=>{
    const libs=[
      {id:'marked',src:'https://cdn.jsdelivr.net/npm/marked@15/marked.min.js'},
      {id:'hljs',src:'https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11/build/highlight.min.js'},
      {id:'hljsL',src:'https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11/build/languages/markdown.min.js'},
      {id:'mermaid',src:'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js'},
      {id:'katex',src:'https://cdn.jsdelivr.net/npm/katex@0.16/dist/katex.min.js'},
      {id:'katexCSS',src:'https://cdn.jsdelivr.net/npm/katex@0.16/dist/katex.min.css',css:true}
    ];
    let n=0;const tot=libs.length;
    const onLoad=()=>{if(++n>=tot)resolve()};
    for(const lib of libs){
      if(document.getElementById(lib.id)){onLoad();continue}
      const el=document.createElement(lib.css?'link':'script');el.id=lib.id;
      if(lib.css){el.rel='stylesheet';el.href=lib.src}else{el.src=lib.src}
      el.onload=onLoad;el.onerror=onLoad;document.head.appendChild(el);
    }
  });
}
function getTheme(){return document.documentElement.getAttribute('data-theme')||'light'}
function queuePreview(){cancelAnimationFrame(previewRaf);previewRaf=requestAnimationFrame(renderPreview)}
function renderPreview(){
  const doc=docs[activeId];if(!doc||!previewActive)return;
  let md=doc.body;
  const mBlocks=[],mInlines=[];
  md=md.replace(/\$\$([\s\S]*?)\$\$/g,(_,t)=>{mBlocks.push(t.trim());return'\x00MB'+(mBlocks.length-1)+'\x00'});
  md=md.replace(/\$([^\$\n]+?)\$/g,(_,t)=>{mInlines.push(t.trim());return'\x00MI'+(mInlines.length-1)+'\x00'});
  if(window.marked){
    const hljs=window.hljs;
    window.marked.setOptions({gfm:true,breaks:false,pedantic:false,highlight:hljs?(c,l)=>{if(l&&hljs.getLanguage(l))return hljs.highlight(c,{language:l}).value;return hljs.highlightAuto(c).value}:undefined});
  }
  let html=window.marked?window.marked.parse(md):md.replace(/</g,'&lt;').replace(/\n/g,'<br>');
  html=html.replace(/\x00MB(\d+)\x00/g,(_,i)=>'<div class="mb" data-math="'+encodeURIComponent(mBlocks[parseInt(i)])+'"></div>');
  html=html.replace(/\x00MI(\d+)\x00/g,(_,i)=>'<span class="mi" data-math="'+encodeURIComponent(mInlines[parseInt(i)])+'"></span>');
  const mermaidBlocks=[];
  html=html.replace(/<pre><code class="language-mermaid">([\s\S]*?)<\/code><\/pre>/g,(_,c)=>{
    const d=c.replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"');
    mermaidBlocks.push(d);return'<div class="mc" data-mermaid="'+(mermaidBlocks.length-1)+'"></div>';
  });
  pc.innerHTML=html;
  if(window.mermaid&&mermaidBlocks.length){
    try{
      window.mermaid.initialize({startOnLoad:false,theme:getTheme()==='dark'?'dark':'default',securityLevel:'loose',fontFamily:'EB Garamond, serif'});
      pc.querySelectorAll('.mc').forEach((c,i)=>{
        if(mermaidBlocks[i]!==undefined){
          window.mermaid.render('m-'+Date.now()+'-'+i,mermaidBlocks[i]).then(({svg})=>{c.innerHTML=svg}).catch(()=>{c.innerHTML='<div class="me">Diagram error</div>'});
        }
      });
    }catch{pc.querySelectorAll('.mc').forEach(c=>{c.innerHTML='<div class="me">Diagram error</div>'})}
  }
  if(window.katex){
    pc.querySelectorAll('.mb[data-math]').forEach(el=>{try{window.katex.render(decodeURIComponent(el.dataset.math),el,{displayMode:true,throwOnError:false})}catch{}});
    pc.querySelectorAll('.mi[data-math]').forEach(el=>{try{window.katex.render(decodeURIComponent(el.dataset.math),el,{displayMode:false,throwOnError:false})}catch{}});
  }
}

}
function doPrint(){
  const s=document.createElement('style');s.id='ps';s.textContent='@media print{header,aside,footer,.ze,.sc,.ec,.search-bar{display:none!important}main{left:0!important}.ew{max-width:100%;padding:1cm}.pv{display:block!important}.pc{font-size:11pt;line-height:1.6}pre{white-space:pre-wrap;word-wrap:break-word}}';document.head.appendChild(s);window.print();setTimeout(()=>s.remove(),1000);
}

// ── Theme ──
function getPreferred(){const s=localStorage.getItem(TK);if(s)return s;return window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'}
function setTheme(t){document.documentElement.setAttribute('data-theme',t);localStorage.setItem(TK,t);if(previewActive)queuePreview()}
function toggleTheme(){const c=document.documentElement.getAttribute('data-theme')||'light';setTheme(c==='dark'?'light':'dark');requestAnimationFrame(updCaret)}

// ── Zen ──
function toggleZen(){document.body.classList.toggle('zen')}

// ── Events ──
editor.addEventListener('input',()=>{scheduleSave();requestAnimationFrame(updCaret);if(previewActive)queuePreview();if(outlineOpen)renderOutline()});
editor.addEventListener('keyup',()=>{updatePos();requestAnimationFrame(updCaret);if(focusMode)updateActiveLine();if(typewriterMode)centerActiveLine()});
editor.addEventListener('click',()=>{updatePos();requestAnimationFrame(updCaret);if(focusMode)updateActiveLine();if(typewriterMode)centerActiveLine()});
editor.addEventListener('scroll',()=>requestAnimationFrame(updCaret));
editor.addEventListener('blur',hideCaret);
editor.addEventListener('focus',()=>requestAnimationFrame(updCaret));
editor.addEventListener('paste',handlePaste);
editor.addEventListener('drop',handleDrop);
editor.addEventListener('dragover',e=>e.preventDefault());
editor.addEventListener('keydown',handleAutoPair);
title.addEventListener('input',scheduleSave);
searchInput.addEventListener('input',doSearch);

$('bSidebar').addEventListener('click',()=>{sidebar.classList.toggle('collapsed');mainEl.classList.toggle('expanded');footerEl.classList.toggle('expanded');requestAnimationFrame(updCaret)});
bPreview.addEventListener('click',togglePreview);
$('bEHtml').addEventListener('click',exportHTML);
$('bEPdf').addEventListener('click',exportPDF);
$('bSearch').addEventListener('click',toggleSearch);
$('bOutline').addEventListener('click',toggleOutline);
$('bZen').addEventListener('click',toggleZen);
$('bEscZen').addEventListener('click',toggleZen);
$('bNew').addEventListener('click',newDoc);
$('bTheme').addEventListener('click',toggleTheme);
$('sPrev').addEventListener('click',searchPrev);
$('sNext').addEventListener('click',searchNext);
$('sReplace').addEventListener('click',doReplace);
$('sReplaceAll').addEventListener('click',doReplaceAll);
$('sClose').addEventListener('click',toggleSearch);

document.addEventListener('keydown',handleShortcuts);
window.addEventListener('resize',()=>requestAnimationFrame(updCaret));
window.matchMedia('(prefers-color-scheme:dark)').addEventListener('change',e=>{if(!localStorage.getItem(TK))setTheme(e.matches?'dark':'light')});

// ── Init ──
setTheme(getPreferred());loadDocs();activeId=Object.keys(docs)[0];loadDoc();renderFiles();updateTime();createMirror();setInterval(updateTime,30000);editor.focus();
})();
</script>
</body>
